apiVersion: batch/v1
kind: Job
metadata:
  name: production-store-bootstrap
  labels:
    app.kubernetes.io/name: store-bootstrap
    app.kubernetes.io/part-of: meshr
  annotations:
    # A new immutable event-plane digest must run the one-shot command again.
    # The command is idempotent after the first clean launch, while force lets
    # Flux replace a completed Job whose image changed between releases.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-bootstrap
        app.kubernetes.io/part-of: meshr
    spec:
      serviceAccountName: meshr-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: store-bootstrap
          image: ${EVENT_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["production-bootstrap"]
          envFrom:
            - configMapRef: {name: meshr-runtime}
          env:
            - name: MESHR_RELEASE_SHA
              value: ${MESHR_RELEASE_SHA}
            # Include the selected databases in the Job template so a
            # same-image restore reruns bootstrap against the new stores.
            - name: MESHR_FIRESTORE_DATABASE
              value: ${MESHR_FIRESTORE_DATABASE}
            - name: MESHR_TOPOLOGY_FIRESTORE_DATABASE
              value: ${MESHR_TOPOLOGY_FIRESTORE_DATABASE}
            - name: MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN
              value: ${MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
