apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-runtime
data:
  MESHR_ENV: production
  MESHR_STORAGE: firestore
  # Ordinary email/password admission is durable in Firestore. Social
  # providers remain separately available when their verifier is configured.
  MESHR_SOCIAL_AUTH_ONLY: "0"
  MESHR_SECURE_COOKIES: "1"
  MESHR_WEBMCP_SESSION_TRANSFER: "1"
  # Resident accounts keep operator-only provenance in the private registry;
  # no cohort disclosure is exposed through the public app or auth config.
  MESHR_RESIDENT_COHORT_ENABLED: "1"
  MESHR_RESIDENT_PUBLIC_DISCLOSURE: "0"
  # Flux substitutes both database IDs from the protected runtime-values
  # ConfigMap. This keeps a restore cutover explicit and reversible instead of
  # baking the authority database into the image or overlay.
  MESHR_FIRESTORE_DATABASE: ${MESHR_YAML_QUOTE}${MESHR_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
  # The live gateway and topology materializer use this aggregate-only
  # database. It must not be the authoritative default database.
  MESHR_TOPOLOGY_FIRESTORE_DATABASE: ${MESHR_YAML_QUOTE}${MESHR_TOPOLOGY_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
  # Event-worker delivery traces are isolated from authority state. These are
  # explicit so a production rollout cannot silently fall back to the default.
  MESHR_EVENT_AUDIT_FIRESTORE_DATABASE: ${MESHR_YAML_QUOTE}${MESHR_EVENT_AUDIT_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
  MESHR_NOTIFICATIONS_FIRESTORE_DATABASE: ${MESHR_YAML_QUOTE}${MESHR_NOTIFICATIONS_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
  MESHR_MODERATION_FIRESTORE_DATABASE: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
  # Workers wait for the bootstrap Job to publish this exact authority
  # generation before subscribing to topology events. CI sets it to pending
  # during a restore and attests the value after the Job completes.
  MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID: ${MESHR_YAML_QUOTE}${MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID}${MESHR_YAML_QUOTE}
  MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN: ${MESHR_YAML_QUOTE}${MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN}${MESHR_YAML_QUOTE}
  MESHR_DATABASE_CUTOVER_MODE: ${MESHR_YAML_QUOTE}${MESHR_DATABASE_CUTOVER_MODE}${MESHR_YAML_QUOTE}
  MESHR_CUTOVER_VALIDATION_MESH_ID: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_MESH_ID}${MESHR_YAML_QUOTE}
  MESHR_CUTOVER_VALIDATION_BINDING_ID: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_BINDING_ID}${MESHR_YAML_QUOTE}
  MESHR_CUTOVER_VALIDATION_AGENT_ID: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_AGENT_ID}${MESHR_YAML_QUOTE}
  MESHR_CUTOVER_VALIDATION_SESSION_ID: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_SESSION_ID}${MESHR_YAML_QUOTE}
  # Flux substitutes this from the protected runtime-values ConfigMap. Keep
  # the rendered value in the API pod template so a mode change rolls the
  # replicas instead of relying on envFrom's non-restarting semantics.
  MESHR_COST_PROTECTION_MODE: ${MESHR_YAML_QUOTE}${MESHR_COST_PROTECTION_MODE}${MESHR_YAML_QUOTE}
  # The promoted immutable image SHA is read back by release evidence checks.
  # Flux substitutes this from the protected runtime-values ConfigMap.
  MESHR_RELEASE_SHA: ${MESHR_YAML_QUOTE}${MESHR_RELEASE_SHA}${MESHR_YAML_QUOTE}
  MESHR_HOST: 0.0.0.0
  MESHR_WEB_URL: https://meshr.social/
  MESHR_API_URL: http://api.meshr.svc.cluster.local:8787
  # Automated screening decisions cross this token-authenticated API rather
  # than granting the provider worker direct post-mutation authority.
  MESHR_MODERATION_AUTHORITY_URL: http://api.meshr.svc.cluster.local:8787
  # Flux substitutes this from the protected flux-system/meshr-runtime-values
  # ConfigMap during promotion. Keep the example value non-operational.
  GOOGLE_CLOUD_PROJECT: ${MESHR_YAML_QUOTE}${GCP_PROJECT_ID}${MESHR_YAML_QUOTE}
  MESHR_EVENTS_TOPIC: mesh-events
  MESHR_TOPOLOGY_SUBSCRIPTION: topology-materializer
  MESHR_MODERATION_SUBSCRIPTION: moderation-worker
  MESHR_MODERATION_SCREENING_TOPIC: moderation-screening
  MESHR_MODERATION_SCREENING_SUBSCRIPTION: moderation-screening-worker
  MESHR_AUDIT_SUBSCRIPTION: audit-worker
  MESHR_NOTIFICATIONS_SUBSCRIPTION: notification-worker
  # The moderation worker refuses to start until the approved Model Armor /
  # Sensitive Data Protection adapter URL is supplied through protected Flux
  # runtime values. There is no silent production no-op.
  MESHR_MODERATION_REQUIRED: "1"
  MESHR_MODERATION_ENDPOINT: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_ENDPOINT}${MESHR_YAML_QUOTE}
  MESHR_MODERATION_HEALTHCHECK_URL: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_HEALTHCHECK_URL}${MESHR_YAML_QUOTE}
  MESHR_MODERATION_AUDIENCE: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_AUDIENCE}${MESHR_YAML_QUOTE}
  MESHR_MODERATION_RELEASE_SHA: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_RELEASE_SHA}${MESHR_YAML_QUOTE}
  MESHR_MODERATION_REVISION_TAG: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_REVISION_TAG}${MESHR_YAML_QUOTE}
  MESHR_DEAD_LETTER_TOPIC: mesh-events-dlq
  MESHR_ALLOWED_ORIGINS: https://meshr.social
  # Safe only with the OpenTofu Cloud Armor default-deny and zone-specific
  # origin-secret rules that prevent direct clients from supplying this header.
  MESHR_TRUST_CLOUDFLARE_CONNECTING_IP: "1"
  # Per-pod and per-credential WebSocket ceilings keep one account or source
  # address from exhausting gateway/API capacity before Cloud Armor limits.
  MESHR_LIVE_MAX_CLIENTS: "512"
  MESHR_LIVE_MAX_CONNECTIONS_PER_CREDENTIAL: "8"
  MESHR_LIVE_MAX_CONNECTIONS_PER_IP: "64"
  MESHR_LIVE_AUTH_RECHECK_MS: "60000"
  MESHR_IDENTITY_PROJECT_ID: ${MESHR_YAML_QUOTE}${GCP_PROJECT_ID}${MESHR_YAML_QUOTE}
  MESHR_IDENTITY_AUTH_DOMAIN: ${MESHR_YAML_QUOTE}${GCP_PROJECT_ID}.firebaseapp.com${MESHR_YAML_QUOTE}
