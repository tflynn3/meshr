apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-runtime
data:
  MESHR_ENV: production
  MESHR_STORAGE: firestore
  MESHR_SOCIAL_AUTH_ONLY: "1"
  MESHR_SECURE_COOKIES: "1"
  MESHR_WEBMCP_SESSION_TRANSFER: "1"
  MESHR_FIRESTORE_DATABASE: "(default)"
  # The live gateway and topology materializer use this aggregate-only
  # database. It must not be the authoritative default database.
  MESHR_TOPOLOGY_FIRESTORE_DATABASE: meshr-projections
  # Flux substitutes this from the protected runtime-values ConfigMap. Keep
  # the rendered value in the API pod template so a mode change rolls the
  # replicas instead of relying on envFrom's non-restarting semantics.
  MESHR_COST_PROTECTION_MODE: ${MESHR_COST_PROTECTION_MODE}
  MESHR_HOST: 0.0.0.0
  MESHR_WEB_URL: https://meshr.social/
  MESHR_API_URL: http://api.meshr.svc.cluster.local:8787
  # Flux substitutes this from the protected flux-system/meshr-runtime-values
  # ConfigMap during promotion. Keep the example value non-operational.
  GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
  MESHR_EVENTS_TOPIC: mesh-events
  MESHR_TOPOLOGY_SUBSCRIPTION: topology-materializer
  MESHR_MODERATION_SUBSCRIPTION: moderation-worker
  MESHR_MODERATION_SCREENING_TOPIC: moderation-screening
  MESHR_MODERATION_SCREENING_SUBSCRIPTION: moderation-screening-worker
  MESHR_AUDIT_SUBSCRIPTION: audit-worker
  MESHR_NOTIFICATIONS_SUBSCRIPTION: notification-worker
  # The moderation worker refuses to start until the approved Model Armor /
  # Sensitive Data Protection adapter URL is supplied through protected Flux
  # runtime values. There is no silent production no-op.
  MESHR_MODERATION_REQUIRED: "1"
  MESHR_MODERATION_ENDPOINT: ${MESHR_MODERATION_ENDPOINT}
  MESHR_MODERATION_HEALTHCHECK_URL: ${MESHR_MODERATION_HEALTHCHECK_URL}
  MESHR_MODERATION_AUDIENCE: ${MESHR_MODERATION_AUDIENCE}
  MESHR_DEAD_LETTER_TOPIC: mesh-events-dlq
  MESHR_ALLOWED_ORIGINS: https://meshr.social
  # Per-pod and per-credential WebSocket ceilings keep one account or source
  # address from exhausting gateway/API capacity before Cloud Armor limits.
  MESHR_LIVE_MAX_CLIENTS: "512"
  MESHR_LIVE_MAX_CONNECTIONS_PER_CREDENTIAL: "8"
  MESHR_LIVE_MAX_CONNECTIONS_PER_IP: "64"
  MESHR_LIVE_AUTH_RECHECK_MS: "60000"
  MESHR_IDENTITY_PROJECT_ID: ${GCP_PROJECT_ID}
  MESHR_IDENTITY_AUTH_DOMAIN: ${GCP_PROJECT_ID}.firebaseapp.com
  MESHR_EVENT_INGEST_URL: http://ingest.meshr.svc.cluster.local:8080
