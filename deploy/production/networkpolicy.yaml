apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ingest}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
        # External browser/API traffic reaches the service through the
        # managed GKE Gateway dataplane.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        # Google Front Ends and managed load-balancer health checks do not
        # originate from the Gateway controller namespace. Keep the
        # documented probe ranges explicit so the default-deny policy does not
        # make a healthy Service look broken to the external ALB.
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8787}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-gateway-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: web}}
  policyTypes: [Ingress]
  ingress:
    # GKE's managed Gateway dataplane proxies requests from this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: live-gateway-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingest-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ingest}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: event-plane-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: meshr}}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8787}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
    # Workload Identity on GKE Autopilot/Dataplane V2 obtains ADC tokens from
    # the node metadata server. Keep this exception narrow: no other metadata
    # destinations or ports are reachable from Meshr workloads.
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports: [{protocol: TCP, port: 80}]
