apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: meshr
  annotations:
    networking.gke.io/certmap: meshr-social
    networking.gke.io/security-policy: meshr-cloud-armor
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: meshr-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: meshr.social
      tls: {mode: Terminate}
      allowedRoutes: {namespaces: {from: Same}}
    - name: staging-https
      protocol: HTTPS
      port: 443
      hostname: staging.meshr.social
      tls: {mode: Terminate}
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: meshr}
spec:
  parentRefs: [{name: meshr, sectionName: https}]
  hostnames: [meshr.social]
  rules:
    - matches: [{path: {type: PathPrefix, value: /v1/live}}]
      backendRefs: [{name: live-gateway, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs: [{name: api, port: 8787}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: web, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: meshr-staging}
spec:
  parentRefs: [{name: meshr, sectionName: staging-https}]
  hostnames: [staging.meshr.social]
  rules:
    - matches: [{path: {type: PathPrefix, value: /v1/live}}]
      backendRefs: [{name: live-gateway, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs: [{name: api, port: 8787}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: web, port: 8080}]
