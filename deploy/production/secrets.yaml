# GKE's managed Secret Manager CSI component projects these values into the
# pod filesystem. The application reads them once at startup and never writes
# them back to Kubernetes or logs them. Create both Secret Manager versions
# before promoting the production Kustomization.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-api-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-identity-api-key/versions/latest"
        path: "identity-api-key"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-renewal-recovery/versions/latest"
        path: "renewal-recovery"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-renewal-recovery-previous/versions/latest"
        path: "renewal-recovery-previous"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-invitation-pepper/versions/latest"
        path: "invitation-pepper"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-invitation-pepper-previous/versions/latest"
        path: "invitation-pepper-previous"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-moderation-authority-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-moderation-authority-token/versions/latest"
        path: "moderation-authority-token"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-event-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-internal-token/versions/latest"
        path: "internal-token"
