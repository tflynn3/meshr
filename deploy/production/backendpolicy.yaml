apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api-cloud-armor
spec:
  default:
    timeoutSec: 60
    securityPolicy: meshr-cloud-armor
  targetRef:
    group: ""
    kind: Service
    name: api
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: live-gateway-cloud-armor
spec:
  default:
    # Keep the backend open longer than the Gateway's 30 second default. The
    # application sends heartbeats, but the load balancer must not reap a
    # healthy WebSocket while its consumer is quiet.
    timeoutSec: 3600
    securityPolicy: meshr-cloud-armor
  targetRef:
    group: ""
    kind: Service
    name: live-gateway
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: web-cloud-armor
spec:
  default:
    timeoutSec: 60
    securityPolicy: meshr-cloud-armor
  targetRef:
    group: ""
    kind: Service
    name: web
