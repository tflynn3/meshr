apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-production-image-digests
  namespace: flux-system
data:
  # CI updates these values only after signature and SBOM verification.
  API_IMAGE: us-central1-docker.pkg.dev/PROJECT_ID/meshr/api@sha256:REPLACE_IMMUTABLE_DIGEST
  EVENT_PLANE_IMAGE: us-central1-docker.pkg.dev/PROJECT_ID/meshr/event-plane@sha256:REPLACE_IMMUTABLE_DIGEST
  # Signed handoff consumed by the protected OpenTofu Cloud Run apply.
  MODERATION_ADAPTER_IMAGE: us-central1-docker.pkg.dev/PROJECT_ID/meshr/moderation-adapter@sha256:REPLACE_IMMUTABLE_DIGEST
  WEB_IMAGE: us-central1-docker.pkg.dev/PROJECT_ID/meshr/web@sha256:REPLACE_IMMUTABLE_DIGEST
