apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meshr-canary
  namespace: flux-system
spec:
  interval: 1m
  path: ./deploy/canary
  prune: true
  # The topology materializer uses a generation fence that is intentionally
  # pending until the bootstrap Job is attested by the promotion workflow.
  # Keep health checks explicit so the first reconcile can apply the Job and
  # the workflow can patch the expected generation before checking the
  # materializer rollout itself.
  wait: false
  timeout: 15m
  dependsOn:
    - name: meshr-metrics-adapter
  sourceRef:
    kind: GitRepository
    name: meshr-main
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: canary-store-bootstrap
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: api-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: live-gateway-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: web-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: ingest-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: topology-materializer-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: moderation-worker-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: moderation-screening-worker-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: audit-worker-canary
      namespace: meshr-canary
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-worker-canary
      namespace: meshr-canary
  postBuild:
    substitute:
      MESHR_YAML_QUOTE: '"'
    substituteFrom:
      - kind: ConfigMap
        name: meshr-canary-image-digests
      - kind: ConfigMap
        name: meshr-canary-runtime-values
