apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meshr-production
  namespace: flux-system
spec:
  interval: 1m
  path: ./deploy/production
  prune: true
  # The topology materializer uses a generation fence that is intentionally
  # pending until the bootstrap Job is attested by the promotion workflow.
  # Keep health checks explicit so the first reconcile can apply the Job and
  # the workflow can patch the expected generation before checking the
  # materializer rollout itself.
  wait: false
  timeout: 15m
  dependsOn:
    - name: meshr-metrics-adapter
  sourceRef:
    kind: GitRepository
    name: meshr
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: production-store-bootstrap
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: live-gateway
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: ingest
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: topology-materializer
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: moderation-worker
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: moderation-screening-worker
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: audit-worker
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-worker
      namespace: meshr
  postBuild:
    # Kustomize removes ordinary scalar quote style before Flux substitution.
    # The workload manifests use this fixed wrapper to preserve string types.
    substitute:
      MESHR_YAML_QUOTE: '"'
    substituteFrom:
      - kind: ConfigMap
        name: meshr-production-image-digests
      - kind: ConfigMap
        name: meshr-production-runtime-values
