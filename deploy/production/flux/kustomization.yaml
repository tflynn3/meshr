apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meshr-production
  namespace: flux-system
spec:
  interval: 1m
  path: ./deploy/production
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: meshr
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: meshr
    - apiVersion: apps/v1
      kind: Deployment
      name: live-gateway
      namespace: meshr
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: meshr-image-digests
      - kind: ConfigMap
        name: meshr-runtime-values
