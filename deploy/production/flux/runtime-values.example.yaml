apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-production-runtime-values
  namespace: flux-system
data:
  # Create this ConfigMap from protected deployment automation. It is kept as
  # an example so a repository checkout never contains a real project ID.
  GCP_PROJECT_ID: PROJECT_ID
  MESHR_FIRESTORE_DATABASE: (default)
  MESHR_TOPOLOGY_FIRESTORE_DATABASE: meshr-projections
  MESHR_EVENT_AUDIT_FIRESTORE_DATABASE: meshr-audit
  MESHR_NOTIFICATIONS_FIRESTORE_DATABASE: meshr-notifications
  MESHR_MODERATION_FIRESTORE_DATABASE: meshr-moderation
  MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID: pending
  MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN: "1"
  MESHR_DATABASE_CUTOVER_MODE: off
  MESHR_CUTOVER_VALIDATION_MESH_ID: validation-mesh-id
  MESHR_CUTOVER_VALIDATION_BINDING_ID: validation-binding-id
  MESHR_CUTOVER_VALIDATION_AGENT_ID: validation-agent-id
  MESHR_CUTOVER_VALIDATION_SESSION_ID: validation-session-id
  MESHR_MODERATION_ENDPOINT: https://r-0123456789abcdef0123---meshr-moderation-adapter-000000000000.us-central1.run.app/screen
  MESHR_MODERATION_HEALTHCHECK_URL: https://r-0123456789abcdef0123---meshr-moderation-adapter-000000000000.us-central1.run.app/healthz
  MESHR_MODERATION_AUDIENCE: https://meshr-moderation-adapter-000000000000.us-central1.run.app
  MESHR_MODERATION_RELEASE_SHA: 0123456789abcdef0123456789abcdef01234567
  MESHR_MODERATION_REVISION_TAG: r-0123456789abcdef0123
  MESHR_RELEASE_SHA: 89abcdef0123456789abcdef0123456789abcdef
  MESHR_COST_PROTECTION_MODE: normal
