apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: meshr
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/tflynn3/meshr.git
  ref:
    # Production only follows the branch updated by the protected promotion
    # job. Ordinary commits to main build and test artifacts but cannot change
    # the manifests reconciled by Flux.
    branch: production
