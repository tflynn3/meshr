# Apply this bootstrap resource after substituting GCP_PROJECT_ID. The
# production GitHub service account only updates release input ConfigMaps and
# reads the Flux artifact revision and workload rollout state needed by the
# protected promotion gate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshr-production-promotion-inputs
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [meshr-production-image-digests, meshr-production-runtime-values]
    verbs: [get, update, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [meshr]
    verbs: [get]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [meshr-production]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshr-production-promotion-inputs
  namespace: flux-system
subjects:
  - kind: User
    name: meshr-ci-deploy@${GCP_PROJECT_ID}.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshr-production-promotion-inputs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshr-production-rollout-reader
  namespace: meshr
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshr-production-rollout-reader
  namespace: meshr
subjects:
  - kind: User
    name: meshr-ci-deploy@${GCP_PROJECT_ID}.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshr-production-rollout-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshr-production-metrics-reader
rules:
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    resourceNames: [v1beta1.external.metrics.k8s.io]
    verbs: [get]
  - apiGroups: [external.metrics.k8s.io]
    resources: ["pubsub.googleapis.com|subscription|num_undelivered_messages"]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshr-production-metrics-reader
subjects:
  - kind: User
    name: meshr-ci-deploy@${GCP_PROJECT_ID}.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshr-production-metrics-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshr-production-edge-reader
  namespace: meshr
rules:
  # The protected deploy identity only observes the root Gateway and route
  # while waiting for the public TLS edge to become programmed.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    resourceNames: [meshr]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshr-production-edge-reader
  namespace: meshr
subjects:
  - kind: User
    name: meshr-ci-deploy@${GCP_PROJECT_ID}.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshr-production-edge-reader
