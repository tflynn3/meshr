apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-canary-runtime-values
  namespace: flux-system
data:
  # Protected canary automation supplies the real project and moderation
  # adapter. Keep this separate from production so a canary change cannot
  # silently roll the public deployment.
  GCP_PROJECT_ID: PROJECT_ID
  MESHR_FIRESTORE_DATABASE: meshr-canary
  MESHR_TOPOLOGY_FIRESTORE_DATABASE: meshr-canary-projections
  MESHR_MODERATION_ENDPOINT: https://moderation.example.invalid/screen
  MESHR_MODERATION_HEALTHCHECK_URL: https://moderation.example.invalid/healthz
  MESHR_MODERATION_AUDIENCE: https://moderation.example.invalid
  MESHR_RELEASE_SHA: RELEASE_SHA
  MESHR_COST_PROTECTION_MODE: normal
