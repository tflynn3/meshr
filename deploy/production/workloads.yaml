apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
  labels: {app.kubernetes.io/name: live-gateway, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: live-gateway, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-live-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: live-gateway
          image: ${MESHR_YAML_QUOTE}${EVENT_PLANE_IMAGE}${MESHR_YAML_QUOTE}
          args: ["live-gateway"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          env:
            - {name: MESHR_PORT, value: "8080"}
            - name: MESHR_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_TOPOLOGY_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_TOPOLOGY_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            # Explicitly templated so cost-protection changes roll the live
