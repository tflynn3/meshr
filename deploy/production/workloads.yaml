            - name: MESHR_COST_PROTECTION_MODE
              value: ${MESHR_YAML_QUOTE}${MESHR_COST_PROTECTION_MODE}${MESHR_YAML_QUOTE}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 150m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: live-gateway}
spec:
  selector: {app.kubernetes.io/name: live-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: live-gateway}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
