apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-worker
  labels: {app.kubernetes.io/name: moderation-worker, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: moderation-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: moderation-worker, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-moderation-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: moderation-worker
          image: ${MESHR_YAML_QUOTE}${EVENT_PLANE_IMAGE}${MESHR_YAML_QUOTE}
          args: ["materializer", "moderation"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          # Keep endpoint rotation in the pod template so Flux rolls existing
          # intake workers on a changed queue configuration. Provider calls
          # belong exclusively to the screening deployment below.
          env:
            - name: MESHR_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_TOPOLOGY_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_TOPOLOGY_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
# Intake only acknowledges the source event after the durable moderation inbox
# and screening-job publish both succeed. Keep its autoscaling CPU-based; the
# provider queue is consumed by the dedicated screening deployment below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-screening-worker
  labels: {app.kubernetes.io/name: moderation-screening-worker, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: moderation-screening-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: moderation-screening-worker, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-moderation-screening-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: moderation-screening-worker
          image: ${MESHR_YAML_QUOTE}${EVENT_PLANE_IMAGE}${MESHR_YAML_QUOTE}
          args: ["materializer", "moderation-screening"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          env:
            - name: MESHR_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_TOPOLOGY_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_TOPOLOGY_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_ENDPOINT
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_ENDPOINT}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_HEALTHCHECK_URL
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_HEALTHCHECK_URL}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_AUTH
              value: adc
            - name: MESHR_MODERATION_TOKEN_TYPE
              value: id_token
            - name: MESHR_MODERATION_AUDIENCE
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_AUDIENCE}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_REVISION_TAG
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_REVISION_TAG}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_RELEASE_SHA
              value: ${MESHR_YAML_QUOTE}${MESHR_MODERATION_RELEASE_SHA}${MESHR_YAML_QUOTE}
            - name: MESHR_MODERATION_AUTHORITY_URL
              value: http://api.meshr.svc.cluster.local:8787
            - name: MESHR_MODERATION_AUTHORITY_TOKEN_FILE
              value: /var/run/secrets/meshr-moderation/moderation-authority-token
            - name: MESHR_MODERATION_CONCURRENCY
              value: "8"
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: meshr-moderation-authority-secrets, mountPath: /var/run/secrets/meshr-moderation, readOnly: true}
      volumes:
        - name: meshr-moderation-authority-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-moderation-authority-secrets}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: moderation-screening-worker}
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: moderation-screening-worker}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
    # This is the durable provider-work queue, not the already-acknowledged
    # moderation intake subscription. The external metric is served by the
    # pinned GKE Cloud Monitoring adapter and verified before promotion.
    - type: External
      external:
        metric:
          name: pubsub.googleapis.com|subscription|num_undelivered_messages
          selector:
            matchLabels:
              resource.labels.subscription_id: moderation-screening-worker
        target: {type: AverageValue, averageValue: "20"}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: moderation-worker}
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: moderation-worker}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
