apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: meshr}
    spec:
      serviceAccountName: meshr-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ${MESHR_YAML_QUOTE}${API_IMAGE}${MESHR_YAML_QUOTE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: meshr-runtime}
          env:
            - name: MESHR_PORT
              value: "8787"
            # Keep the selected databases in the pod template so a protected
            # restore rolls every replica even when the image is unchanged.
            - name: MESHR_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_TOPOLOGY_FIRESTORE_DATABASE
              value: ${MESHR_YAML_QUOTE}${MESHR_TOPOLOGY_FIRESTORE_DATABASE}${MESHR_YAML_QUOTE}
            - name: MESHR_DATABASE_CUTOVER_MODE
              value: ${MESHR_YAML_QUOTE}${MESHR_DATABASE_CUTOVER_MODE}${MESHR_YAML_QUOTE}
            - name: MESHR_CUTOVER_VALIDATION_MESH_ID
              value: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_MESH_ID}${MESHR_YAML_QUOTE}
            - name: MESHR_CUTOVER_VALIDATION_BINDING_ID
              value: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_BINDING_ID}${MESHR_YAML_QUOTE}
            - name: MESHR_CUTOVER_VALIDATION_AGENT_ID
              value: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_AGENT_ID}${MESHR_YAML_QUOTE}
            - name: MESHR_CUTOVER_VALIDATION_SESSION_ID
              value: ${MESHR_YAML_QUOTE}${MESHR_CUTOVER_VALIDATION_SESSION_ID}${MESHR_YAML_QUOTE}
            - name: MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID
              value: ${MESHR_YAML_QUOTE}${MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID}${MESHR_YAML_QUOTE}
            - name: MESHR_IDENTITY_API_KEY_FILE
              value: /var/run/secrets/meshr/identity-api-key
            - name: MESHR_INTERNAL_TOKEN_FILE
              value: /var/run/secrets/meshr/internal-token
            - name: MESHR_MODERATION_AUTHORITY_TOKEN_FILE
              value: /var/run/secrets/meshr-moderation/moderation-authority-token
            - name: MESHR_RENEWAL_RECOVERY_SECRET_FILE
              value: /var/run/secrets/meshr/renewal-recovery
            - name: MESHR_RENEWAL_RECOVERY_SECRET_PREVIOUS_FILE
              value: /var/run/secrets/meshr/renewal-recovery-previous
            - name: MESHR_INVITATION_PEPPER_FILE
              value: /var/run/secrets/meshr/invitation-pepper
            - name: MESHR_INVITATION_PEPPER_PREVIOUS_FILE
              value: /var/run/secrets/meshr/invitation-pepper-previous
            # Explicitly templated so Flux changes to cost protection trigger
            # a Deployment rollout; envFrom alone would leave old pods live.
            - name: MESHR_COST_PROTECTION_MODE
              value: ${MESHR_YAML_QUOTE}${MESHR_COST_PROTECTION_MODE}${MESHR_YAML_QUOTE}
            # Keep the promoted revision in the pod template so a digest-only
            # release or retry rolls API replicas that report /healthz.
            - name: MESHR_RELEASE_SHA
              value: ${MESHR_YAML_QUOTE}${MESHR_RELEASE_SHA}${MESHR_YAML_QUOTE}
            # The API hashes this Downward API UID before exposing a
            # non-secret health fingerprint used by the multi-replica gate.
            - name: MESHR_POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          ports: [{name: http, containerPort: 8787}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - {name: meshr-api-secrets, mountPath: /var/run/secrets/meshr, readOnly: true}
            - {name: meshr-moderation-authority-secrets, mountPath: /var/run/secrets/meshr-moderation, readOnly: true}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: meshr-api-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-api-secrets}
        - name: meshr-moderation-authority-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-moderation-authority-secrets}
---
apiVersion: v1
