---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: topology-materializer}
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: topology-materializer}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
