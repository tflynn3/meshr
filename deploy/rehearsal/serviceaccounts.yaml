apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-api
  annotations:
    iam.gke.io/gcp-service-account: ${MESHR_REHEARSAL_API_GSA}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-bootstrap
  annotations:
    iam.gke.io/gcp-service-account: ${MESHR_REHEARSAL_BOOTSTRAP_GSA}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-ingest
  annotations:
    iam.gke.io/gcp-service-account: ${MESHR_REHEARSAL_INGEST_GSA}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-topology-materializer
  annotations:
    iam.gke.io/gcp-service-account: ${MESHR_REHEARSAL_TOPOLOGY_GSA}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-live-gateway
  annotations:
    iam.gke.io/gcp-service-account: ${MESHR_REHEARSAL_LIVE_GSA}
---
# The static server does not call Google APIs. A dedicated tokenless KSA keeps
# the rehearsal from accidentally widening its Workload Identity boundary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshr-web
automountServiceAccountToken: false
