apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          env:
            - {name: MESHR_PORT, value: "8787"}
            - name: MESHR_IDENTITY_API_KEY
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: identity-api-key}}
            - name: MESHR_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: internal-token}}
            - name: MESHR_MODERATION_AUTHORITY_TOKEN
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: moderation-authority-token}}
            - name: MESHR_RENEWAL_RECOVERY_SECRET
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: renewal-recovery}}
            - name: MESHR_RENEWAL_RECOVERY_SECRET_PREVIOUS
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: renewal-recovery-previous}}
            - name: MESHR_INVITATION_PEPPER
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: invitation-pepper}}
            - name: MESHR_INVITATION_PEPPER_PREVIOUS
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: invitation-pepper-previous}}
          ports: [{name: http, containerPort: 8787}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 200m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8787, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ${WEB_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - {name: MESHR_ENV, value: production}
            - {name: MESHR_SECURE_COOKIES, value: "1"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /web-healthz, port: http}}
          livenessProbe: {httpGet: {path: /web-healthz, port: http}, initialDelaySeconds: 10}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 20m, memory: 32Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
