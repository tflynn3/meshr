    spec:
      serviceAccountName: meshr-ingest
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingest
          image: ${EVENT_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["ingest"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          env:
            - name: MESHR_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: meshr-runtime-secrets, key: internal-token}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ingest}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ingest}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-materializer
  labels: {app.kubernetes.io/name: topology-materializer, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: topology-materializer}}
  template:
    metadata: {labels: {app.kubernetes.io/name: topology-materializer, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-topology-materializer
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: materializer
          image: ${EVENT_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["materializer", "topology"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 250m, memory: 384Mi, ephemeral-storage: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: topology-materializer}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: topology-materializer}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
  labels: {app.kubernetes.io/name: live-gateway, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: live-gateway, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-live-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: live-gateway
          image: ${EVENT_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["live-gateway"]
          envFrom: [{configMapRef: {name: meshr-runtime}}]
          env:
            - {name: MESHR_PORT, value: "8080"}
            # The only route into this namespace is an authenticated kubectl
            # port-forward. This private-only switch lets the event-path smoke
            # observe topology without provisioning a real social identity.
            - {name: MESHR_LOCAL_MODE, value: "1"}
            - {name: MESHR_LIVE_ALLOW_ANONYMOUS, value: "1"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: live-gateway}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: live-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
