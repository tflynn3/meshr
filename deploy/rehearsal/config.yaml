apiVersion: v1
kind: ConfigMap
metadata:
  name: meshr-runtime
data:
  # Exercise the same Firestore/startup checks as production while the
  # surrounding cluster remains private and disposable.
  MESHR_ENV: production
  MESHR_STORAGE: firestore
  MESHR_SOCIAL_AUTH_ONLY: "1"
  MESHR_SECURE_COOKIES: "1"
  MESHR_WEBMCP_SESSION_TRANSFER: "1"
  GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
  MESHR_IDENTITY_PROJECT_ID: ${GCP_PROJECT_ID}
  MESHR_IDENTITY_AUTH_DOMAIN: ${GCP_PROJECT_ID}.firebaseapp.com
  MESHR_FIRESTORE_DATABASE: ${MESHR_REHEARSAL_AUTHORITY_DATABASE}
  MESHR_TOPOLOGY_FIRESTORE_DATABASE: ${MESHR_REHEARSAL_TOPOLOGY_DATABASE}
  MESHR_EVENT_AUDIT_FIRESTORE_DATABASE: ${MESHR_REHEARSAL_AUDIT_DATABASE}
  MESHR_NOTIFICATIONS_FIRESTORE_DATABASE: ${MESHR_REHEARSAL_NOTIFICATIONS_DATABASE}
  MESHR_MODERATION_FIRESTORE_DATABASE: ${MESHR_REHEARSAL_MODERATION_DATABASE}
  MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID: pending
  MESHR_FORCE_PROJECTION_BOOTSTRAP_SCAN: "1"
  MESHR_COST_PROTECTION_MODE: protect
  MESHR_RELEASE_SHA: ${MESHR_REHEARSAL_RELEASE_SHA}
  MESHR_HOST: 0.0.0.0
  MESHR_WEB_URL: ${MESHR_REHEARSAL_WEB_ORIGIN}/
  MESHR_API_URL: http://api.meshr-rehearsal.svc.cluster.local:8787
  MESHR_EVENTS_TOPIC: ${MESHR_REHEARSAL_EVENTS_TOPIC}
  MESHR_TOPOLOGY_SUBSCRIPTION: ${MESHR_REHEARSAL_TOPOLOGY_SUBSCRIPTION}
  # Only the topology consumer is deployed in this bounded rehearsal. These
  # names remain distinct so production event-plane validation cannot fall
  # back to local defaults.
  MESHR_MODERATION_SUBSCRIPTION: meshr-rehearsal-moderation
  MESHR_MODERATION_SCREENING_TOPIC: meshr-rehearsal-moderation-screening
  MESHR_MODERATION_SCREENING_SUBSCRIPTION: meshr-rehearsal-moderation-screening
  MESHR_AUDIT_SUBSCRIPTION: meshr-rehearsal-audit
  MESHR_NOTIFICATIONS_SUBSCRIPTION: meshr-rehearsal-notifications
  MESHR_DEAD_LETTER_TOPIC: meshr-rehearsal-events-dlq
  MESHR_MODERATION_REQUIRED: "0"
  MESHR_ALLOWED_ORIGINS: ${MESHR_REHEARSAL_WEB_ORIGIN}
  MESHR_LIVE_MAX_CLIENTS: "32"
  MESHR_LIVE_MAX_CONNECTIONS_PER_CREDENTIAL: "4"
  MESHR_LIVE_MAX_CONNECTIONS_PER_IP: "8"
  MESHR_LIVE_AUTH_RECHECK_MS: "60000"
