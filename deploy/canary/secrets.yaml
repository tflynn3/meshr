apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-api-secrets-canary
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-identity-api-key/versions/latest${MESHR_YAML_QUOTE}
        path: "identity-api-key"
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-internal-token/versions/latest${MESHR_YAML_QUOTE}
        path: "internal-token"
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-renewal-recovery/versions/latest${MESHR_YAML_QUOTE}
        path: "renewal-recovery"
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-renewal-recovery-previous/versions/latest${MESHR_YAML_QUOTE}
        path: "renewal-recovery-previous"
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-invitation-pepper/versions/latest${MESHR_YAML_QUOTE}
        path: "invitation-pepper"
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-invitation-pepper-previous/versions/latest${MESHR_YAML_QUOTE}
        path: "invitation-pepper-previous"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
