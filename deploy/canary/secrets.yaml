apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-api-secrets-canary
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-canary-identity-api-key/versions/latest"
        path: "identity-api-key"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-canary-internal-token/versions/latest"
        path: "internal-token"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-canary-renewal-recovery/versions/latest"
        path: "renewal-recovery"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-event-secrets-canary
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/meshr-canary-internal-token/versions/latest"
        path: "internal-token"
