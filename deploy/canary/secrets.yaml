        path: "moderation-authority-token"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meshr-event-secrets-canary
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: ${MESHR_YAML_QUOTE}projects/${GCP_PROJECT_ID}/secrets/meshr-canary-internal-token/versions/latest${MESHR_YAML_QUOTE}
        path: "internal-token"
