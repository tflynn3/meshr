apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meshr-canary
resources:
  - namespace.yaml
  # The staging edge is a separate Gateway and route in the canary namespace,
  # so external E2E is possible before production promotion.
  - gateway.yaml
  - serviceaccounts.yaml
  - config.yaml
  - secrets.yaml
  - bootstrap.yaml
  - workloads.yaml
  - event-plane.yaml
  - backendpolicy.yaml
  - healthchecks.yaml
  - networkpolicy.yaml
