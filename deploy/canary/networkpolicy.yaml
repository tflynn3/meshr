apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-canary-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: api-canary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ingest-canary}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: live-gateway-canary}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: moderation-screening-worker-canary}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8787}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-canary-gateway-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: web-canary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: live-gateway-canary-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: live-gateway-canary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gateway-system
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingest-canary-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ingest-canary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api-canary}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: event-plane-canary-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: meshr}}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8787}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports: [{protocol: TCP, port: 80}]
