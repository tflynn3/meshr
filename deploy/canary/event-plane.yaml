apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-canary
  labels: {app.kubernetes.io/name: ingest-canary, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: ingest-canary}}
  template:
    metadata: {labels: {app.kubernetes.io/name: ingest-canary, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-ingest-canary
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingest
          image: ${EVENT_PLANE_IMAGE}
          args: ["ingest"]
          envFrom: [{configMapRef: {name: meshr-runtime-canary}}]
          env:
            - {name: MESHR_INTERNAL_TOKEN_FILE, value: /var/run/secrets/meshr/internal-token}
            - {name: MESHR_FIRESTORE_DATABASE, value: "${MESHR_FIRESTORE_DATABASE}"}
            - {name: MESHR_TOPOLOGY_FIRESTORE_DATABASE, value: "${MESHR_TOPOLOGY_FIRESTORE_DATABASE}"}
            - {name: MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID, value: "${MESHR_EXPECTED_AUTHORITY_BOOTSTRAP_ID}"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: meshr-event-secrets, mountPath: /var/run/secrets/meshr, readOnly: true}
      volumes:
        - name: meshr-event-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-event-secrets-canary}
---
apiVersion: v1
kind: Service
metadata: {name: ingest-canary}
spec:
  selector: {app.kubernetes.io/name: ingest-canary}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ingest-canary}
spec:
  minReplicas: 2
  maxReplicas: 3
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ingest-canary}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-materializer-canary
  labels: {app.kubernetes.io/name: topology-materializer-canary, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: topology-materializer-canary}}
