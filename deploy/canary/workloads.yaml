apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  labels: {app.kubernetes.io/name: api-canary, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api-canary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-canary, app.kubernetes.io/part-of: meshr}
    spec:
      serviceAccountName: meshr-api-canary
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: meshr-runtime-canary}}]
          env:
            - {name: MESHR_PORT, value: "8787"}
            # Keep the selected databases in the pod template so a protected
            # restore rolls every replica even when the image is unchanged.
            - {name: MESHR_FIRESTORE_DATABASE, value: "${MESHR_FIRESTORE_DATABASE}"}
            - {name: MESHR_TOPOLOGY_FIRESTORE_DATABASE, value: "${MESHR_TOPOLOGY_FIRESTORE_DATABASE}"}
            - {name: MESHR_DATABASE_CUTOVER_MODE, value: "${MESHR_DATABASE_CUTOVER_MODE}"}
            - {name: MESHR_CUTOVER_VALIDATION_MESH_ID, value: "${MESHR_CUTOVER_VALIDATION_MESH_ID}"}
            - {name: MESHR_CUTOVER_VALIDATION_BINDING_ID, value: "${MESHR_CUTOVER_VALIDATION_BINDING_ID}"}
            - {name: MESHR_CUTOVER_VALIDATION_AGENT_ID, value: "${MESHR_CUTOVER_VALIDATION_AGENT_ID}"}
            - {name: MESHR_CUTOVER_VALIDATION_SESSION_ID, value: "${MESHR_CUTOVER_VALIDATION_SESSION_ID}"}
            - {name: MESHR_IDENTITY_API_KEY_FILE, value: /var/run/secrets/meshr/identity-api-key}
            - {name: MESHR_MODERATION_AUTHORITY_TOKEN_FILE, value: /var/run/secrets/meshr-moderation/moderation-authority-token}
            - {name: MESHR_RENEWAL_RECOVERY_SECRET_FILE, value: /var/run/secrets/meshr/renewal-recovery}
            - {name: MESHR_RENEWAL_RECOVERY_SECRET_PREVIOUS_FILE, value: /var/run/secrets/meshr/renewal-recovery-previous}
            - {name: MESHR_INVITATION_PEPPER_FILE, value: /var/run/secrets/meshr/invitation-pepper}
            - {name: MESHR_INVITATION_PEPPER_PREVIOUS_FILE, value: /var/run/secrets/meshr/invitation-pepper-previous}
            - name: MESHR_COST_PROTECTION_MODE
              value: ${MESHR_COST_PROTECTION_MODE}
            # Keep release evidence aligned with the canary pods after a
            # digest-only promotion or retry.
            - name: MESHR_RELEASE_SHA
              value: ${MESHR_RELEASE_SHA}
          ports: [{name: http, containerPort: 8787}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          volumeMounts:
            - {name: meshr-api-secrets, mountPath: /var/run/secrets/meshr, readOnly: true}
            - {name: meshr-moderation-authority-secrets, mountPath: /var/run/secrets/meshr-moderation, readOnly: true}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumes:
        - name: meshr-api-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-api-secrets-canary}
        - name: meshr-moderation-authority-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: meshr-moderation-authority-secrets-canary}
---
apiVersion: v1
kind: Service
metadata: {name: api-canary}
spec:
  selector: {app.kubernetes.io/name: api-canary}
  ports: [{name: http, port: 8787, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api-canary}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: api-canary}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  labels: {app.kubernetes.io/name: web-canary, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: web-canary}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web-canary, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-web-canary
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ${WEB_IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /web-healthz, port: http}}
          livenessProbe: {httpGet: {path: /web-healthz, port: http}, initialDelaySeconds: 10}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web-canary}
spec:
  selector: {app.kubernetes.io/name: web-canary}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway-canary
  labels: {app.kubernetes.io/name: live-gateway-canary, app.kubernetes.io/part-of: meshr}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: live-gateway-canary}}
  template:
    metadata: {labels: {app.kubernetes.io/name: live-gateway-canary, app.kubernetes.io/part-of: meshr}}
    spec:
      serviceAccountName: meshr-live-gateway-canary
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: live-gateway
          image: ${EVENT_PLANE_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["live-gateway"]
          envFrom: [{configMapRef: {name: meshr-runtime-canary}}]
          env:
            - {name: MESHR_PORT, value: "8080"}
            - {name: MESHR_FIRESTORE_DATABASE, value: "${MESHR_FIRESTORE_DATABASE}"}
            - {name: MESHR_TOPOLOGY_FIRESTORE_DATABASE, value: "${MESHR_TOPOLOGY_FIRESTORE_DATABASE}"}
            - {name: MESHR_COST_PROTECTION_MODE, value: "${MESHR_COST_PROTECTION_MODE}"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 150m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: live-gateway-canary}
spec:
  selector: {app.kubernetes.io/name: live-gateway-canary}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: live-gateway-canary}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: live-gateway-canary}}
