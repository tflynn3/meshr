apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-sqlite
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: control-api
    app.kubernetes.io/part-of: meshr
spec:
  replicas: 1
  # The local API mounts a single-writer SQLite volume. A rolling restart can
  # leave the replacement pod pending while the old pod still owns the PVC,
  # which makes the smoke gate time out. Recreate keeps the dev/emulator
  # topology deterministic; production uses Firestore and its own strategy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: control-api
      app.kubernetes.io/part-of: meshr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: control-api
        app.kubernetes.io/part-of: meshr
    spec:
      containers:
        - name: api
          image: meshr-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MESHR_HOST
              value: 0.0.0.0
            - name: MESHR_PORT
              value: "8787"
            - name: MESHR_DB_PATH
              value: /data/meshr.db
            - name: MESHR_WEB_URL
              value: http://localhost:8080/
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-sqlite
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: control-api
    app.kubernetes.io/part-of: meshr
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: meshr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: meshr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: meshr
    spec:
      containers:
        - name: web
          image: meshr-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /web-healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: meshr
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: meshr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest
      app.kubernetes.io/component: ingest
      app.kubernetes.io/part-of: meshr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
        app.kubernetes.io/component: ingest
        app.kubernetes.io/part-of: meshr
    spec:
      initContainers:
        - name: bootstrap-event-plane
          image: meshr-event-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/event_plane_bin.runfiles/_main/event_plane.mjs", "bootstrap"]
          envFrom:
            - configMapRef:
                name: event-plane
      containers:
        - name: ingest
          image: meshr-event-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/event_plane_bin.runfiles/_main/event_plane.mjs", "ingest"]
          envFrom:
            - configMapRef:
                name: event-plane
          env:
            - name: MESHR_BASE_PATH
              value: /__local/ingest
            - name: MESHR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: local-internal-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__local/ingest/healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: meshr
  ports:
    - name: http
      port: 8080
      targetPort: http
---
