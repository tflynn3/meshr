apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
  labels:
    app.kubernetes.io/name: live-gateway
    app.kubernetes.io/component: live-gateway
    app.kubernetes.io/part-of: meshr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-gateway
      app.kubernetes.io/component: live-gateway
      app.kubernetes.io/part-of: meshr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-gateway
        app.kubernetes.io/component: live-gateway
        app.kubernetes.io/part-of: meshr
    spec:
      initContainers:
        - name: bootstrap-event-plane
          image: meshr-event-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/event_plane_bin.runfiles/_main/event_plane.mjs", "bootstrap"]
          envFrom:
            - configMapRef:
                name: event-plane
      containers:
        - name: live-gateway
          image: meshr-event-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/event_plane_bin.runfiles/_main/event_plane.mjs", "live-gateway"]
          envFrom:
            - configMapRef:
                name: event-plane
          env:
            - name: MESHR_LOCAL_MODE
              value: "1"
            # The local smoke harness intentionally exercises the live
            # projection before a browser session exists. This opt-in bypass
            # is scoped to the isolated local profile; production never sets
            # it and always requires a verified human or agent grant.
            - name: MESHR_LIVE_ALLOW_ANONYMOUS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: live-gateway
spec:
  selector:
    app.kubernetes.io/name: live-gateway
    app.kubernetes.io/component: live-gateway
    app.kubernetes.io/part-of: meshr
  ports:
    - name: http
      port: 8080
      targetPort: http
