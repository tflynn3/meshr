apiVersion: apps/v1
kind: Deployment
metadata:
  name: firestore
  labels:
    app.kubernetes.io/name: firestore
    app.kubernetes.io/component: emulator
    app.kubernetes.io/part-of: meshr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firestore
      app.kubernetes.io/component: emulator
      app.kubernetes.io/part-of: meshr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firestore
        app.kubernetes.io/component: emulator
        app.kubernetes.io/part-of: meshr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: firestore
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:540.0.0-emulators
          args:
            - gcloud
            - emulators
            - firestore
            - start
            - --host-port=0.0.0.0:8080
            - --project=meshr-local
            - --database-mode=firestore-native
            - --quiet
          env:
            - {name: HOME, value: /tmp}
            - {name: CLOUDSDK_CONFIG, value: /tmp/.config/gcloud}
          ports:
            - name: grpc
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: firestore
spec:
  selector:
    app.kubernetes.io/name: firestore
    app.kubernetes.io/component: emulator
    app.kubernetes.io/part-of: meshr
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
---
