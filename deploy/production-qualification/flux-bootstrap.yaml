# The qualification source intentionally contains ordinary ClusterIP Services,
# but neither the reconciler nor a compromised release may open a transient
# public edge while the qualification environment is private. This operator-owned
# admission boundary applies even if a future controller Role is broadened.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: meshr-production-qualification-private-services.meshr.social
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
        scope: Namespaced
  matchConditions:
    - name: meshr-qualification-namespace
      expression: object.metadata.namespace == 'meshr'
  validations:
    - expression: >-
        (!has(object.spec.type) || object.spec.type == 'ClusterIP') &&
        (!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0) &&
        !has(object.spec.externalName) &&
        !has(object.spec.loadBalancerClass) &&
        (!has(object.spec.allocateLoadBalancerNodePorts) ||
          object.spec.allocateLoadBalancerNodePorts == false) &&
        object.spec.ports.all(port,
          !has(port.nodePort) || port.nodePort == 0)
      message: Qualification Services must remain private ClusterIP endpoints.
