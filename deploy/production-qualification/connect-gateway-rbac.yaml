# Bootstrap this manifest once from the private operator path after replacing
# CONNECT_GATEWAY_DEPLOY_SERVICE_ACCOUNT_EMAIL with the exact protected deploy
# identity. Hosted CI cannot grant itself this access through Connect Gateway.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshr-production-qualification-inputs
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [resourcequotas]
    resourceNames: [meshr-production-qualification-releases]
    verbs: [get]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, create]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [meshr-production-qualification]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [source-controller, kustomize-controller]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [source-controller]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshr-production-qualification-inputs
  namespace: flux-system
subjects:
  - kind: User
    name: ${CONNECT_GATEWAY_DEPLOY_SERVICE_ACCOUNT_EMAIL}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshr-production-qualification-inputs
---
# Exact CRD and admission-contract reads let the hosted qualifier prove that a
# Flux upgrade or policy mutation has not widened the release allowlist. No
# list/watch or cluster-scoped mutation permission is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshr-production-qualification-flux-schema
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - gitrepositories.source.toolkit.fluxcd.io
      - kustomizations.kustomize.toolkit.fluxcd.io
    verbs: [get]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames:
      - meshr-production-qualification-source.meshr.social
      - meshr-production-qualification-inputs.meshr.social
      - meshr-production-qualification-reconciliation.meshr.social
      - meshr-production-qualification-private-services.meshr.social
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshr-production-qualification-flux-schema
subjects:
  - kind: User
    name: ${CONNECT_GATEWAY_DEPLOY_SERVICE_ACCOUNT_EMAIL}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshr-production-qualification-flux-schema
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshr-production-qualification-observer
  namespace: meshr
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Google requires Gateway stream IAM plus Kubernetes subresource access for
  # port-forward. Do not add pods/exec or pods/attach to this qualification
  # identity; live smoke needs only a named Pod tunnel.
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [networking.gke.io]
    resources: [gcpbackendpolicies, healthcheckpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshr-production-qualification-observer
  namespace: meshr
subjects:
  - kind: User
    name: ${CONNECT_GATEWAY_DEPLOY_SERVICE_ACCOUNT_EMAIL}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshr-production-qualification-observer
