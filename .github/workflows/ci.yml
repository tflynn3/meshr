name: Meshr CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize managed image publication for a source ref. Hosted deployment and
# promotion are owned by the private operations repository.
concurrency:
  group: meshr-image-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_REPOSITORY: ${{ vars.GCP_PROJECT_ID }}/meshr

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: npm ci
      - name: Audit JavaScript dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix packages/mcp
          npm audit --audit-level=high --prefix integrations/openclaw
      - name: Scan the source tree for high-severity findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Verify Cloudflare origin ranges have not drifted
        run: npm run check:cloudflare-ranges
      - run: npm run typecheck
      - run: npm run typecheck:live
      - name: Verify the production cost model matches the HPA envelope
        run: npm run cost:model -- --json
      # The root OpenClaw live-contract tests load the packaged plugin entry.
      # Build it before the root test glob so a clean checkout does not depend
      # on an ignored developer artifact left in integrations/openclaw/dist.
      - run: cd integrations/openclaw && npm ci && npm run build
      - name: Start Firestore emulator
        run: |
          set -euo pipefail
          docker run --detach --name meshr-firestore-emulator \
            --publish 8081:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:540.0.0-emulators \
            gcloud beta emulators firestore start \
              --host-port=0.0.0.0:8080 \
              --project=meshr-emulator \
              --quiet
          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/8081) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs meshr-firestore-emulator
          exit 1
      - name: Start Pub/Sub emulator
        run: |
          set -euo pipefail
          docker run --detach --name meshr-pubsub-emulator \
            --publish 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:540.0.0-emulators \
            gcloud beta emulators pubsub start \
              --host-port=0.0.0.0:8085 \
              --project=meshr-event-plane \
              --quiet
          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/8085) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs meshr-pubsub-emulator
          exit 1
      - name: Firestore repository emulator conformance
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          GOOGLE_CLOUD_PROJECT: meshr-emulator
        run: npm run test:firestore
      - name: Event plane emulator end-to-end qualification
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_CLOUD_PROJECT: meshr-event-plane
        run: npm run test:event-plane
      - name: Moderation provider emulator end-to-end qualification
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_CLOUD_PROJECT: meshr-moderation-plane
        run: npm run test:moderation-plane
      - name: Stop emulators
        if: always()
        run: |
          docker rm --force meshr-pubsub-emulator || true
          docker rm --force meshr-firestore-emulator || true
      - run: npm test
      - run: npm run build:npm
      - run: npm run test:connector
      - run: npm run test:live
      - run: npm run test:openclaw-live
      - run: cd packages/mcp && npm ci && npm run typecheck && npm run build
      - run: cd integrations/openclaw && npm test
      - run: npm run test:package-consumer
      # Keep the checked-in OpenClaw manifest generated from the native entry
      # point. The package test exercises runtime factories but does not catch
      # stale manifest metadata or an invalid plugin bundle.
      - run: cd integrations/openclaw && npm run plugin:check
      - run: cd integrations/openclaw && npm run plugin:validate
      - run: terraform fmt -check -recursive infra/opentofu
      - run: terraform -chdir=infra/opentofu init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/opentofu validate
      - run: kubectl kustomize deploy/metrics-adapter >/dev/null
      - run: kubectl kustomize deploy/production >/dev/null
      - run: npm run check:production-qualification
      - run: kubectl kustomize deploy/canary >/dev/null

  # Keep the local GKE-shaped stack as a first-class CI gate. This exercises
  # the Bazel bundle/image graph, the same k3d manifests used by developers,
  # the emulator-backed event plane, and a restart-safe topology snapshot.
  # The job is deliberately ephemeral: the cluster is deleted even when the
  # smoke check fails.
  local-stack:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: npm ci
      - name: Install pinned Bazelisk and k3d
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @bazel/bazelisk@1.28.1
          k3d_version='v5.9.0'
          k3d_url="https://github.com/k3d-io/k3d/releases/download/${k3d_version}/k3d-linux-amd64"
          k3d_sha256='06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0'
          mkdir -p "$RUNNER_TEMP/meshr-bin"
          curl --fail --silent --show-error --location --retry 3 "$k3d_url" --output "$RUNNER_TEMP/meshr-bin/k3d"
          echo "$k3d_sha256  $RUNNER_TEMP/meshr-bin/k3d" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/meshr-bin/k3d"
          export PATH="$RUNNER_TEMP/meshr-bin:$PATH"
          echo "$RUNNER_TEMP/meshr-bin" >> "$GITHUB_PATH"
          bazelisk version
          k3d version
      - name: Start the ephemeral k3d stack
        run: npm run local:up
      - name: Run the event-plane and restart smoke
        run: npm run local:smoke
      - name: Tear down the ephemeral k3d stack
        if: always()
        run: npm run local:down

  # Validate the published package engine contracts on every supported Node
  # line. The root application intentionally targets Node 24, while the
  # standalone MCP package supports the tested Node 20-25 range. OpenClaw's
  # dependency closure installs strictly on the tested Node 22/24/26 lines.
  package-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20.x"
            package: packages/mcp
          - node: "21.x"
            package: packages/mcp
          - node: "22.x"
            package: packages/mcp
          - node: "23.x"
            package: packages/mcp
          - node: "24.x"
            package: packages/mcp
          - node: "25.x"
            package: packages/mcp
          - node: "22.x"
            package: integrations/openclaw
          - node: "24.x"
            package: integrations/openclaw
          - node: "26.x"
            package: integrations/openclaw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install the package source
        run: npm ci --prefix "${{ matrix.package }}" --ignore-scripts --no-audit --no-fund
      - name: Build the package source
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = "packages/mcp" ]; then
            npm run typecheck --prefix "${{ matrix.package }}"
          fi
          npm run build --prefix "${{ matrix.package }}"
      - name: Install and import the packed package as a consumer
        env:
          npm_config_engine_strict: "true"
        run: node scripts/package-consumer-smoke.mjs "${{ matrix.package }}"

  build:
    needs: [verify, local-stack, package-engines]
    if: vars.MESHR_MANAGED_BUILD_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.resolve-release-images.outputs.api }}
      event_plane_digest: ${{ steps.resolve-release-images.outputs.event_plane }}
      moderation_adapter_digest: ${{ steps.resolve-release-images.outputs.moderation_adapter }}
      web_digest: ${{ steps.resolve-release-images.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate protected build inputs
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set the protected GCP_PROJECT_ID repository variable before an image build}"
          : "${GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER:?Set the protected GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER repository secret before an image build}"
          : "${GCP_BUILD_SERVICE_ACCOUNT:?Set the protected GCP_BUILD_SERVICE_ACCOUNT repository variable before an image build}"
          test "$GITHUB_REPOSITORY" = "tflynn3/meshr"
          test "$REPOSITORY_ID" = "1348689949"
          test "$REPOSITORY_OWNER_ID" = "19698887"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          printf '%s' "$GITHUB_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.0-51@sha256:ea2f0dd74e74f101df59f9a6b31d0960994060c7982a921cbceecee0f1841125
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Install the exact checksummed gcloud CLI
        env:
          GCLOUD_VERSION: 582.0.0
          GCLOUD_SHA256: e917ca3a21bc9d5ae13759d11a581a6a948a5170f257f2640a25e7c44cf6a8a5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-$GCLOUD_VERSION-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-$GCLOUD_VERSION-linux-x86_64.tar.gz"
          printf '%s  %s\n' "$GCLOUD_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          test "$(<"$RUNNER_TEMP/google-cloud-sdk/VERSION")" = "$GCLOUD_VERSION"
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" version
          echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"
      - name: Install the exact checksummed Cosign CLI
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cosign"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$binary" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_SHA256" "$binary" | sha256sum --check --strict -
          chmod 0755 "$binary"
          "$binary" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
      # Refresh the short-lived WIF exchange immediately before each long
      # multi-architecture build. A build/push can outlive the GitHub OIDC
      # subject-token window on a cold runner.
      - name: Refresh GCP credentials before API image build
        id: api-build-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Require an immutable empty release tag set
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ACCESS_TOKEN: ${{ steps.api-build-auth.outputs.access_token }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository_json="$RUNNER_TEMP/meshr-artifact-repository.json"
          repository_status="$(curl --silent --show-error \
            --output "$repository_json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GCP_ACCESS_TOKEN" \
            "https://artifactregistry.googleapis.com/v1/projects/$GCP_PROJECT_ID/locations/us-central1/repositories/meshr")"
          test "$repository_status" = "200" || {
            echo "Artifact Registry repository readback failed with HTTP $repository_status." >&2
            exit 1
          }
          jq -e --arg project "$GCP_PROJECT_ID" '
            .name == ("projects/" + $project + "/locations/us-central1/repositories/meshr") and
            .format == "DOCKER" and
            .dockerConfig.immutableTags == true
          ' "$repository_json" >/dev/null
          for image in api event-plane moderation-adapter web; do
            manifest_url="https://$REGISTRY/v2/$IMAGE_REPOSITORY/$image/manifests/$IMAGE_TAG"
            manifest_status="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request HEAD \
              --header "Authorization: Bearer $GCP_ACCESS_TOKEN" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "$manifest_url")"
            case "$manifest_status" in
              404) ;;
              200)
                echo "$image:$IMAGE_TAG already exists; immutable release publication is create-once." >&2
                exit 1
                ;;
              *)
                echo "Could not prove $image:$IMAGE_TAG is absent (HTTP $manifest_status)." >&2
                exit 1
                ;;
            esac
          done
      - name: Login to Artifact Registry for API build
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.api-build-auth.outputs.access_token }}
      - name: Build and push API image
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/images/api.Dockerfile \
            --tag "$REGISTRY/$IMAGE_REPOSITORY/api:$TAG" \
            --provenance="mode=max,version=v1,builder-id=https://github.com/tflynn3/meshr/actions/runs/$GITHUB_RUN_ID" \
            --sbom=true --push .
      - name: Refresh GCP credentials before event-plane image build
        id: event-plane-build-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Login to Artifact Registry for event-plane build
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.event-plane-build-auth.outputs.access_token }}
      - name: Build and push event-plane image
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/images/event-plane.Dockerfile \
            --tag "$REGISTRY/$IMAGE_REPOSITORY/event-plane:$TAG" \
            --provenance="mode=max,version=v1,builder-id=https://github.com/tflynn3/meshr/actions/runs/$GITHUB_RUN_ID" \
            --sbom=true --push .
      - name: Refresh GCP credentials before moderation-adapter image build
        id: moderation-adapter-build-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Login to Artifact Registry for moderation-adapter build
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.moderation-adapter-build-auth.outputs.access_token }}
      - name: Build and push moderation-adapter image
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/images/moderation-adapter.Dockerfile \
            --build-arg "MESHR_MODERATION_RELEASE_SHA=$GITHUB_SHA" \
            --tag "$REGISTRY/$IMAGE_REPOSITORY/moderation-adapter:$TAG" \
            --provenance="mode=max,version=v1,builder-id=https://github.com/tflynn3/meshr/actions/runs/$GITHUB_RUN_ID" \
            --sbom=true --push .
      - name: Refresh GCP credentials before web image build
        id: web-build-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Login to Artifact Registry for web build
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.web-build-auth.outputs.access_token }}
      - name: Build and push web image
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/images/web.Dockerfile \
            --tag "$REGISTRY/$IMAGE_REPOSITORY/web:$TAG" \
            --provenance="mode=max,version=v1,builder-id=https://github.com/tflynn3/meshr/actions/runs/$GITHUB_RUN_ID" \
            --sbom=true --push .
      - name: Refresh GCP credentials before image signing
        id: signing-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Login to Artifact Registry for image signing
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.signing-auth.outputs.access_token }}
      - name: Resolve immutable release image digests
        id: resolve-release-images
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.signing-auth.outputs.access_token }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in api event-plane moderation-adapter web; do
            ref="$REGISTRY/$IMAGE_REPOSITORY/$image:$IMAGE_TAG"
            digest="$(gcloud artifacts docker images describe "$ref" --format='value(image_summary.digest)')"
            printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            key="${image//-/_}"
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Verify every release image provenance and SBOM
        env:
          MESHR_REGISTRY_BEARER_TOKEN: ${{ steps.signing-auth.outputs.access_token }}
          MESHR_EXPECTED_BUILDER_ID: https://github.com/tflynn3/meshr/actions/runs/${{ github.run_id }}
          API_DIGEST: ${{ steps.resolve-release-images.outputs.api }}
          EVENT_PLANE_DIGEST: ${{ steps.resolve-release-images.outputs.event_plane }}
          MODERATION_ADAPTER_DIGEST: ${{ steps.resolve-release-images.outputs.moderation_adapter }}
          WEB_DIGEST: ${{ steps.resolve-release-images.outputs.web }}
          IMAGE_EVIDENCE_PATH: ${{ runner.temp }}/meshr-release-image-evidence.json
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/meshr-release-image-evidence"
          mkdir -p "$evidence_dir"
          for record in \
            "api|api|deploy/images/api.Dockerfile|$API_DIGEST" \
            "eventPlane|event-plane|deploy/images/event-plane.Dockerfile|$EVENT_PLANE_DIGEST" \
            "moderationAdapter|moderation-adapter|deploy/images/moderation-adapter.Dockerfile|$MODERATION_ADAPTER_DIGEST" \
            "web|web|deploy/images/web.Dockerfile|$WEB_DIGEST"; do
            IFS='|' read -r key image dockerfile digest <<<"$record"
            bash scripts/verify-moderation-adapter-image.sh \
              "$REGISTRY/$IMAGE_REPOSITORY/$image@$digest" \
              "$GITHUB_SHA" \
              "$dockerfile" \
              "$evidence_dir/$key.json"
          done
          jq -n \
            --slurpfile api "$evidence_dir/api.json" \
            --slurpfile eventPlane "$evidence_dir/eventPlane.json" \
            --slurpfile moderationAdapter "$evidence_dir/moderationAdapter.json" \
            --slurpfile web "$evidence_dir/web.json" \
            '{
              api:$api[0],
              eventPlane:$eventPlane[0],
              moderationAdapter:$moderationAdapter[0],
              web:$web[0]
            }' >"$IMAGE_EVIDENCE_PATH"
          jq -e --arg sha "$GITHUB_SHA" '
            (keys | sort) == ["api", "eventPlane", "moderationAdapter", "web"] and
            all(.[];
              .schemaVersion == 1 and .sourceSha == $sha and
              (.platforms | length) == 2 and
              (.attestations | length) == 2)
          ' "$IMAGE_EVIDENCE_PATH" >/dev/null
      - name: Scan every immutable runtime image manifest
        env:
          TRIVY_USERNAME: oauth2accesstoken
          TRIVY_PASSWORD: ${{ steps.signing-auth.outputs.access_token }}
          API_DIGEST: ${{ steps.resolve-release-images.outputs.api }}
          EVENT_PLANE_DIGEST: ${{ steps.resolve-release-images.outputs.event_plane }}
          MODERATION_ADAPTER_DIGEST: ${{ steps.resolve-release-images.outputs.moderation_adapter }}
          WEB_DIGEST: ${{ steps.resolve-release-images.outputs.web }}
          IMAGE_EVIDENCE_PATH: ${{ runner.temp }}/meshr-release-image-evidence.json
          SCAN_RECEIPT_PATH: ${{ runner.temp }}/meshr-runtime-image-scans.json
        run: |
          set -euo pipefail
          : "${REGISTRY:?The Artifact Registry host is required}"
          : "${IMAGE_REPOSITORY:?The Artifact Registry repository is required}"
          scan_entries="$RUNNER_TEMP/meshr-runtime-image-scans.jsonl"
          : >"$scan_entries"
          for pair in \
            "api:api" \
            "event-plane:eventPlane" \
            "moderation-adapter:moderationAdapter" \
            "web:web"; do
            image="${pair%%:*}"
            evidence_key="${pair#*:}"
            image_repository="$REGISTRY/$IMAGE_REPOSITORY/$image"
            for architecture in amd64 arm64; do
              platform="linux/$architecture"
              child_digest="$(jq -r \
                --arg key "$evidence_key" \
                --arg platform "$platform" '
                .[$key].platforms[] |
                  select(.platform == $platform) |
                  .manifestDigest
              ' "$IMAGE_EVIDENCE_PATH")"
              printf '%s' "$child_digest" |
                grep -Eq '^sha256:[a-f0-9]{64}$'
              child_ref="$image_repository@$child_digest"
              report="$RUNNER_TEMP/meshr-$image-$architecture-trivy.json"
              trivy image \
                --platform "$platform" \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --format json \
                --output "$report" \
                --no-progress \
                --timeout 10m \
                "$child_ref"
              jq -e '
                .SchemaVersion == 2 and
                ([.Results[]?.Vulnerabilities[]? |
                  select(.Severity == "HIGH" or .Severity == "CRITICAL")] |
                  length) == 0
              ' "$report" >/dev/null
              jq -cn \
                --arg image "$image" \
                --arg platform "$platform" \
                --arg manifestRef "$child_ref" \
                --arg reportSha256 \
                  "sha256:$(sha256sum "$report" | awk '{print $1}')" \
                '{
                  image:$image,
                  platform:$platform,
                  manifestRef:$manifestRef,
                  severity:"HIGH,CRITICAL",
                  findings:0,
                  reportSha256:$reportSha256
                }' >>"$scan_entries"
            done
          done
          jq -s 'sort_by(.image, .platform)' "$scan_entries" >"$SCAN_RECEIPT_PATH"
          jq -e '
            length == 8 and
            all(.[];
              .findings == 0 and
              (.manifestRef |
                test("@sha256:[a-f0-9]{64}$")))
          ' "$SCAN_RECEIPT_PATH" >/dev/null
      - name: Sign immutable image indexes
        env:
          COSIGN_EXPERIMENTAL: "1"
          API_DIGEST: ${{ steps.resolve-release-images.outputs.api }}
          EVENT_PLANE_DIGEST: ${{ steps.resolve-release-images.outputs.event_plane }}
          MODERATION_ADAPTER_DIGEST: ${{ steps.resolve-release-images.outputs.moderation_adapter }}
          WEB_DIGEST: ${{ steps.resolve-release-images.outputs.web }}
        run: |
          set -euo pipefail
          for pair in \
            "api:$API_DIGEST" \
            "event-plane:$EVENT_PLANE_DIGEST" \
            "moderation-adapter:$MODERATION_ADAPTER_DIGEST" \
            "web:$WEB_DIGEST"; do
            image="${pair%%:*}"
            digest="${pair#*:}"
            cosign sign --yes "$REGISTRY/$IMAGE_REPOSITORY/$image@$digest"
          done
      - name: Verify immutable signatures and publish the closed receipt
        env:
          COSIGN_EXPERIMENTAL: "1"
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.signing-auth.outputs.access_token }}
          IMAGE_TAG: ${{ github.sha }}
          API_DIGEST: ${{ steps.resolve-release-images.outputs.api }}
          EVENT_PLANE_DIGEST: ${{ steps.resolve-release-images.outputs.event_plane }}
          MODERATION_ADAPTER_DIGEST: ${{ steps.resolve-release-images.outputs.moderation_adapter }}
          WEB_DIGEST: ${{ steps.resolve-release-images.outputs.web }}
          RECEIPT_PATH: ${{ runner.temp }}/meshr-release-image-receipt.json
          IMAGE_EVIDENCE_PATH: ${{ runner.temp }}/meshr-release-image-evidence.json
          SCAN_RECEIPT_PATH: ${{ runner.temp }}/meshr-runtime-image-scans.json
        run: |
          set -euo pipefail
          for pair in \
            "api:$API_DIGEST" \
            "event-plane:$EVENT_PLANE_DIGEST" \
            "moderation-adapter:$MODERATION_ADAPTER_DIGEST" \
            "web:$WEB_DIGEST"; do
            image="${pair%%:*}"
            digest="${pair#*:}"
            immutable="$REGISTRY/$IMAGE_REPOSITORY/$image@$digest"
            resolved_again="$(gcloud artifacts docker images describe \
              "$REGISTRY/$IMAGE_REPOSITORY/$image:$IMAGE_TAG" \
              --format='value(image_summary.digest)')"
            test "$resolved_again" = "$digest" || {
              echo "$image:$IMAGE_TAG moved after its immutable digest was resolved." >&2
              exit 1
            }
            cosign verify "$immutable" \
              --certificate-identity='https://github.com/tflynn3/meshr/.github/workflows/ci.yml@refs/heads/main' \
              --certificate-github-workflow-sha='${{ github.sha }}' \
              --certificate-github-workflow-trigger='push' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              --output=json |
              jq -e 'type == "array" and length > 0' >/dev/null
          done
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg registry "$REGISTRY/$IMAGE_REPOSITORY" \
            --arg api "$API_DIGEST" \
            --arg eventPlane "$EVENT_PLANE_DIGEST" \
            --arg moderationAdapter "$MODERATION_ADAPTER_DIGEST" \
            --arg web "$WEB_DIGEST" \
            --slurpfile evidence "$IMAGE_EVIDENCE_PATH" \
            --slurpfile scans "$SCAN_RECEIPT_PATH" \
            '{
              schemaVersion: 1,
              source: {
                repository:"tflynn3/meshr",
                repositoryId:"1348689949",
                repositoryOwnerId:"19698887",
                sha:$sha
              },
              build: {
                workflowPath:".github/workflows/ci.yml",
                workflowRef:"tflynn3/meshr/.github/workflows/ci.yml@refs/heads/main",
                workflowSha:$sha,
                event:"push",
                runId:$runId,
                runAttempt:$runAttempt,
                toolchain: {
                  buildxVersion:"v0.36.1",
                  buildkitImage:"moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8",
                  binfmtImage:"tonistiigi/binfmt:qemu-v9.2.0-51@sha256:ea2f0dd74e74f101df59f9a6b31d0960994060c7982a921cbceecee0f1841125",
                  trivyVersion:"0.73.0"
                },
                runtimeScans:$scans[0],
                imageEvidence:$evidence[0]
              },
              images: {
                api: ($registry + "/api@" + $api),
                eventPlane: ($registry + "/event-plane@" + $eventPlane),
                moderationAdapter: ($registry + "/moderation-adapter@" + $moderationAdapter),
                web: ($registry + "/web@" + $web)
              },
              moderationAdapter: $evidence[0].moderationAdapter
            }' >"$RECEIPT_PATH"
          jq -e --arg sha "$GITHUB_SHA" --arg runAttempt "$GITHUB_RUN_ATTEMPT" '
            (keys | sort) ==
              ["build", "images", "moderationAdapter", "schemaVersion", "source"] and
            .schemaVersion == 1 and .source.sha == $sha and
            .build.workflowSha == $sha and .build.event == "push" and
            .build.runAttempt == $runAttempt and
            ($runAttempt | test("^[1-9][0-9]*$")) and
            (.images | length) == 4 and
            (.build.runtimeScans | length) == 8 and
            (.build.imageEvidence | keys | sort) ==
              ["api", "eventPlane", "moderationAdapter", "web"] and
            .build.imageEvidence.api.image == .images.api and
            .build.imageEvidence.eventPlane.image == .images.eventPlane and
            .build.imageEvidence.moderationAdapter.image ==
              .images.moderationAdapter and
            .build.imageEvidence.web.image == .images.web and
            all(.build.imageEvidence[]; .sourceSha == $sha) and
            .moderationAdapter.sourceSha == $sha and
            .moderationAdapter == .build.imageEvidence.moderationAdapter
          ' "$RECEIPT_PATH" >/dev/null
          {
            echo '### Signed immutable release images'
            echo '| Image | Immutable reference |'
            echo '| --- | --- |'
            jq -r '.images | to_entries[] | "| `\(.key)` | `\(.value)` |"' "$RECEIPT_PATH"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload immutable release image receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshr-release-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meshr-release-image-receipt.json
          if-no-files-found: error
          retention-days: 90
